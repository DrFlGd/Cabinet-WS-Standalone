name: Publish Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "v$version"
          if ("$env:GITHUB_REF_NAME" -ne $expected) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package.json version $expected"
          }

      - name: Install dependencies
        run: npm install

      - name: Build renderer
        run: npm run build

      - name: Build portable Windows executable
        run: npx electron-builder --win portable

      - name: Create release ZIP and checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = Get-ChildItem release -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No packaged executable was produced." }

          $zip = "release/Cabinet-WS-Standalone-$version-Windows-x64.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force

          $exeHash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash  $($exe.Name)"
            "$zipHash  $(Split-Path $zip -Leaf)"
          ) | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - name: Publish named GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" release/*.exe release/*.zip release/SHA256SUMS.txt --verify-tag --title "Cabinet WS Standalone $env:GITHUB_REF_NAME" --generate-notes
