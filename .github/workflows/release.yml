name: Publish Windows Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "release-request.json"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve and verify release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"

          if ("$env:GITHUB_REF_TYPE" -eq "tag") {
            if ("$env:GITHUB_REF_NAME" -ne $tag) {
              throw "Release tag $env:GITHUB_REF_NAME does not match package.json version $tag"
            }
          } else {
            $request = Get-Content release-request.json -Raw | ConvertFrom-Json
            if ("$($request.version)" -ne $version) {
              throw "release-request.json version $($request.version) does not match package.json version $version"
            }
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Build portable Windows executable
        run: npm run desktop:package

      - name: Smoke test packaged Windows executable
        timeout-minutes: 10
        run: npm run smoke:windows

      - name: Create release ZIP and checksums
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No packaged executable was produced." }

          $zip = "release/Cabinet-WS-Standalone-$env:RELEASE_VERSION-Windows-x64.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force

          $exeHash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash  $($exe.Name)"
            "$zipHash  $(Split-Path $zip -Leaf)"
          ) | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - name: Publish named GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub Release $env:RELEASE_TAG already exists."
          }

          if ("$env:GITHUB_REF_TYPE" -eq "tag") {
            gh release create "$env:RELEASE_TAG" release/*.exe release/*.zip release/SHA256SUMS.txt --verify-tag --title "Cabinet WS Standalone $env:RELEASE_TAG" --generate-notes
          } else {
            gh release create "$env:RELEASE_TAG" release/*.exe release/*.zip release/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "Cabinet WS Standalone $env:RELEASE_TAG" --generate-notes
          }
