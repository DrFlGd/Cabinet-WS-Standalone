name: Windows Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run desktop:package
      - name: Smoke test packaged Windows executable
        timeout-minutes: 10
        run: npm run smoke:windows
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cabinet-ws-standalone-windows-smoke
          path: |
            release/smoke-test/smoke-summary.json
            release/smoke-test/electron.log
            release/smoke-test/chromium.log
            release/smoke-test/lifecycle.log
            release/smoke-test/failure.png
            release/smoke-test/smoke-project.cabinetws.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: cabinet-ws-standalone-windows
          path: release/*.exe
          if-no-files-found: error
